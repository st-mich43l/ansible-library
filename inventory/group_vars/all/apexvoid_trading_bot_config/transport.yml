# Transport domain fragment of apexvoid_trading_bot_config.
# Mirrors apexvoid-trading-bot's config/transport.yml domain: Redis
# stream names and the candidate schema version (contract.streams/
# contract.versions in this still-old, pre-cutover key shape) — protocol
# constants, not tuning knobs, same classification note as upstream.
_avc_transport:
  contract:
    streams:
      candidate_maximum_length: 1000
      candidates: auto_trade:candidates
      events: auto_trade:events
      trade_plans: execution:trade_plans
    versions:
      candidate: 6
  kafka:
    # Explicitly render the durable Go opportunity transport instead of
    # relying on the Python model default. The startup gate requires both
    # this broker path and analysis.technical_authority.consumer_enabled.
    enabled: true
    brokers:
      - kafka:9092
    algo_bot_client_id: apexvoid-algo-bot
    topics:
      analysis_opportunity: analysis.opportunity.v1
      analysis_opportunity_invalidated: analysis.opportunity.invalidated.v1
      analysis_opportunity_arbitration: analysis.opportunity.arbitration.v1
