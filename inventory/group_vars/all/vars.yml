---
# =============================================================================
# Centralized deployment configuration — single source of truth.
# Non-secret values live here (committed in clear). Secrets live in vault.yml
# (ansible-vault encrypted) and are referenced through the indirection vars at
# the bottom of this file.
# =============================================================================

# --- Fleet-wide defaults ------------------------------------------------------
deploy_user: apexvoid
deploy_root: /home/apexvoid/deployment
# Where CI/control node stages the (vaulted) private key used to reach the host.
deploy_key_path: /tmp/apexvoid_deploy_key
# Pinned host key file written by playbooks that verify the host (release publishing).
deploy_known_hosts_path: /tmp/apexvoid_known_hosts

# Public half of the deploy key — not secret, authorized by init_env.
deploy_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBcjRObOeBWkIFHcmOZfnWpC0dSwkH7oKfOev4sBzQkf github-actions-deploy@apexvoid"

# --- Per-project deploy table -------------------------------------------------
# Add a service here and it becomes deployable: ansible-playbook deploy.yml -e project=<key>
projects:
  # rsync mode (default): ship a folder and build/run on the host.
  routing:
    repo_dir: routing                 # subdir created under deploy_root
    source: deployment-template       # folder inside the service checkout to ship
    compose_files:
      - docker-compose.yml
      - docker-compose.prod.yml
    compose_args: "up -d --remove-orphans --force-recreate"
    rsync_excludes: [".git", ".github", ".env", "certbot"]
    # nginx config is bind-mounted; reload after syncing new config.
    reload_cmd: "docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload"
    health_url: "http://127.0.0.1/_routing/health"
    tls_health_hosts:
      - "{{ void_occult_host }}"
      - "{{ fate_host }}"
      - "{{ trading_host }}"
      - "{{ ledger_host }}"
    renewal_script: scripts/renew-certificates.sh
    # .env is excluded from rsync (host-only, never committed) — deploy_compose
    # renders it fresh from these vars on every deploy instead, so it can't
    # silently drift from what's declared here (routing's own
    # renew-certificates.sh cron job sources this same .env).
    env_vars:
      ROUTING_HTTP_PORT: "{{ routing_http_port }}"
      ROUTING_HTTPS_PORT: "{{ routing_https_port }}"
      ROUTING_NETWORK: "{{ routing_network }}"
      VOID_OCCULT_HOST: "{{ void_occult_host }}"
      VOID_OCCULT_LOCAL_HOST: "{{ void_occult_local_host }}"
      FATE_HOST: "{{ fate_host }}"
      TRADING_HOST: "{{ trading_host }}"
      LEDGER_HOST: "{{ ledger_host }}"
      PHOTOBOOTH_HOST: "{{ photobooth_host }}"
      VOID_OCCULT_CERT_NAME: "{{ void_occult_cert_name }}"
      CERTBOT_ADDITIONAL_DOMAINS: "{{ certbot_additional_domains }}"

  # image mode: render a compose Jinja template with the pushed image tag, pull, up.
  apexvoid-occult:
    mode: image
    repo_dir: apexvoid-occult
    source: deployment-template       # holds docker-compose.yml.j2
    compose_template: docker-compose.yml.j2
    expected_services: 2              # backend + frontend

  apexvoid-trading:
    mode: image
    repo_dir: apexvoid-trading
    source: deployment-template       # holds docker-compose.yml.j2
    compose_template: docker-compose.yml.j2
    expected_services: 1              # frontend only (no secret env)

  # Static product website (apexvoid-photobooth `webpage` branch): one Nginx
  # container serving pre-built HTML. Public at https://photobooth.apexvoid.net
  # via the routing project. No secrets.
  apexvoid-photobooth-webpage:
    mode: image
    repo_dir: apexvoid-photobooth-webpage
    source: deployment-template       # holds docker-compose.yml.j2
    compose_template: docker-compose.yml.j2
    expected_services: 1              # the website container only
    # Persistent release storage is provisioned before the container (and its
    # read-only bind mount of photobooth_release_public_dir) starts.
    provision_role: photobooth_release_storage

  apexvoid-ledger:
    mode: image
    repo_dir: apexvoid-ledger
    source: deployment-template       # holds docker-compose.yml.j2
    compose_template: docker-compose.yml.j2
    expected_services: 4              # backend + frontend + postgres + push-worker
    required_services: [postgres, backend, frontend, push-worker]
    # Public at https://ledger.apexvoid.net via the routing project.
    # Authenticated users connect their own SePay account; tokens are encrypted
    # in Ledger's database with the deployment-wide Fernet key below.
    secrets_var: apexvoid_ledger_secrets
    required_secret_keys:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - SECRET_KEY
      - DATABASE_URL
      - SEPAY_CREDENTIAL_ENCRYPTION_KEY
      - SEPAY_WEBHOOK_API_KEY
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - VAPID_SUBJECT
      - PUSH_SUBSCRIPTION_KEY

  apexvoid-trading-bot:
    mode: image
    repo_dir: apexvoid-trading-bot
    source: deployment-template       # holds docker-compose.yml.j2
    compose_template: docker-compose.yml.j2
    expected_services: 6              # bot + ctrader + analysis + kafka + postgres + redis (init is one-shot)
    # Structured CONFIG_FILE + secret+bootstrap env_file (manifest authority)
    config_var: apexvoid_trading_bot_config
    bootstrap_env_var: apexvoid_trading_bot_bootstrap_env
    secrets_var: apexvoid_trading_bot_secrets
    config_file_dest: config/trading-bot.yml
    config_source_dir: config
    env_file_dest: secrets/trading-bot.env
    # Bind-mounted service log paths must exist before Compose creates the
    # containers; the Go image then fixes ownership and drops to apexvoid.
    log_dirs:
      - logs/analysis-engine
      - logs/algo-bot
      - logs/ctrader-engine
    # Assert secrets only — trading policy lives in structured config + manifest
    required_secret_keys:
      - TELEGRAM_BOT_TOKEN
      - SCANNER_TELEGRAM_BOT_TOKEN
      - SIGNAL_VIP_CHANNEL_ID
      - TELEGRAM_OWNER_ID
      - DATABASE_URL
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CTRADER_CLIENT_ID
      - CTRADER_CLIENT_SECRET
      - CTRADER_ACCESS_TOKEN
      - CTRADER_REFRESH_TOKEN
      - CTRADER_ACCOUNT_ID
      - TIINGO_API_KEY

# --- Per-project non-secret settings -----------------------------------------
registry_namespace: mich43l
routing_network: routing


# Routing hostnames (non-secret, single source of truth for routing's .env —
# see the routing project's env_vars above). Change a domain here, not on the
# host.
routing_http_port: 80
routing_https_port: 443
void_occult_host: apexvoid.net
void_occult_local_host: void-occult.localhost
fate_host: fate.apexvoid.net
trading_host: trading.apexvoid.net
ledger_host: ledger.apexvoid.net
photobooth_host: photobooth.apexvoid.net
void_occult_cert_name: apexvoid.net
certbot_additional_domains: "fate.apexvoid.net trading.apexvoid.net ledger.apexvoid.net photobooth.apexvoid.net"

# --- ApexVoid Photobooth release distribution (WEB-2) -------------------------
# One authoritative storage root. The publisher (playbooks/publish-photobooth-release.yml),
# the storage provisioning role and the website's compose template (read-only bind mount of
# the public directory at /srv/photobooth-downloads) all derive their paths from these vars.
# Flat variables on purpose: no self-referencing dict.
photobooth_release_root: /home/apexvoid/artifacts/apexvoid-photobooth
photobooth_release_public_dir: "{{ photobooth_release_root }}/public"      # served at /downloads/
photobooth_release_staging_dir: "{{ photobooth_release_root }}/staging"    # private uploads
photobooth_release_state_dir: "{{ photobooth_release_root }}/state"        # lock, journal, manifest backups
photobooth_release_script: "{{ photobooth_release_state_dir }}/bin/publish_release.py"
photobooth_release_public_origin: "https://{{ photobooth_host }}"
photobooth_release_public_prefix: /downloads
photobooth_release_owner: "{{ deploy_user }}"
photobooth_release_group: "{{ deploy_user }}"
photobooth_release_directory_mode: "0755"
photobooth_release_file_mode: "0644"
photobooth_release_private_directory_mode: "0700"
photobooth_release_schema_version: 1
photobooth_release_minimum_free_space_mb: 1024
photobooth_release_retention_enabled: true
photobooth_release_archive_keep: 4
photobooth_release_max_versions: "{{ (photobooth_release_archive_keep | int) + 1 }}"

# SSH host key of the deploy target. Release publishing verifies it
# (StrictHostKeyChecking=yes) instead of the fleet-wide host_key_checking=False.
deploy_target_known_hosts: "[217.216.74.8]:51022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBdLVO54xvVGRj1MoNPSojPplirfJ8TsknYOa/TYvOAS"

# apexvoid-occult backend runtime config (non-secret; env injected via compose template)
apexvoid_occult_gemini_model: "gemini-3.6-flash"
apexvoid_occult_gemini_thinking_budget: "8192"
apexvoid_occult_gemini_max_output_tokens: "24576"
apexvoid_occult_allow_origins: "https://apexvoid.net,https://fate.apexvoid.net"

# --- Secret indirection (values come from vault.yml) --------------------------
# Roles reference these names; only vault.yml holds the actual material.
deploy_ssh_private_key: "{{ vault_deploy_ssh_private_key }}"
apexvoid_occult_gemini_api_key: "{{ vault_apexvoid_occult_gemini_api_key }}"
# Trading-bot secrets only (vault). Public trading policy is cleartext in
# apexvoid_trading_bot_config/ (split by domain; see its README.md);
# process/bootstrap ENV is apexvoid_trading_bot_bootstrap_env.yml. Manifest
# is the runtime authority.
apexvoid_trading_bot_secrets: "{{ vault_apexvoid_trading_bot_env }}"
# apexvoid-ledger: Postgres credentials, session key, and the stable Fernet
# key used to encrypt per-user SePay credentials. Values come from vault.yml.
apexvoid_ledger_secrets: "{{ vault_apexvoid_ledger_env }}"
