---
# Ship a service's deploy folder to the host and run docker compose there.
# Ansible equivalent of action-library/deploy-compose. Config comes from the
# projects table in group_vars; the files come from {{ src_base }} (the service
# checkout on the control node / CI runner).

- name: Resolve project config
  ansible.builtin.set_fact:
    proj: "{{ projects[project] }}"

- name: Fail if project is unknown
  ansible.builtin.fail:
    msg: "Unknown project '{{ project }}'. Known: {{ projects.keys() | list }}"
  when: project not in projects

- name: Ensure target directory exists
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ proj.repo_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Sync deploy files to the host
  ansible.posix.synchronize:
    src: "{{ src_base }}/{{ proj.source }}/"
    dest: "{{ deploy_root }}/{{ proj.repo_dir }}/"
    delete: true
    recursive: true
    # Excluded paths (.env, certbot, ...) are preserved on the host by --delete.
    rsync_opts: "{{ proj.rsync_excludes | default([]) | map('regex_replace', '^(.*)$', '--exclude=\\1') | list }}"

# .env is typically rsync-excluded (host-only, never committed) so it survives
# `synchronize --delete`. For projects that declare env_vars, render it fresh
# from group_vars on every deploy instead of leaving it to drift out of sync
# with what's declared in ansible-library.
- name: Render .env from centralized vars (optional)
  ansible.builtin.copy:
    content: |
      {% for key, value in proj.env_vars.items() %}
      {{ key }}="{{ value }}"
      {% endfor %}
    dest: "{{ deploy_root }}/{{ proj.repo_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  when: proj.env_vars is defined

- name: docker compose up
  ansible.builtin.command:
    cmd: >-
      docker compose
      {{ proj.compose_files | map('regex_replace', '^(.*)$', '-f \1') | join(' ') }}
      {{ proj.compose_args | default('up -d --remove-orphans --force-recreate') }}
    chdir: "{{ deploy_root }}/{{ proj.repo_dir }}"
  register: compose_result
  changed_when: true

# Optional hook for services that support an in-process reload after compose has
# recreated containers.
- name: Post-up reload (optional)
  ansible.builtin.command:
    cmd: "{{ proj.reload_cmd }}"
    chdir: "{{ deploy_root }}/{{ proj.repo_dir }}"
  changed_when: true
  when: proj.reload_cmd is defined and proj.reload_cmd | length > 0

- name: Health check
  ansible.builtin.uri:
    url: "{{ proj.health_url }}"
    status_code: 200
  register: health
  retries: 5
  delay: 3
  until: health.status | default(0) == 200
  when: proj.health_url is defined and proj.health_url | length > 0
