---
# Publish one validated release. Every step that changes public state happens inside
# publish_release.py under the server-side lock; the manifest is replaced last.

- name: Validate the trusted release inputs
  ansible.builtin.assert:
    that:
      - release_src | length > 0
      - release_version is match('^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$')
      - release_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: "release_src, release_version (semver) and release_sha256 (64 hex) are required"
    quiet: true

- name: Validate the centralized retention policy
  ansible.builtin.assert:
    that:
      - photobooth_release_archive_keep is integer
      - photobooth_release_archive_keep | int >= 0
      - photobooth_release_max_versions is integer
      - photobooth_release_max_versions | int == (photobooth_release_archive_keep | int) + 1
    fail_msg: "Retention requires a non-negative archive count and max_versions equal to archive_keep + 1"
    quiet: true

- name: Read the release metadata on the control node
  ansible.builtin.set_fact:
    photobooth_release_meta: "{{ lookup('ansible.builtin.file', release_src ~ '/release.json') | from_json }}"

- name: The metadata describes the requested version and checksum
  ansible.builtin.assert:
    that:
      - photobooth_release_meta.version == release_version
      - photobooth_release_meta.assets[0].sha256 == release_sha256
    fail_msg: "release.json does not match the version/checksum passed by CI"
    quiet: true

- name: Storage is provisioned (idempotent, never overwrites)
  ansible.builtin.include_role:
    name: photobooth_release_storage

- name: Publisher script directory
  ansible.builtin.file:
    path: "{{ photobooth_release_script | dirname }}"
    state: directory
    mode: "{{ photobooth_release_private_directory_mode }}"

- name: Install the publisher script
  ansible.builtin.copy:
    src: publish_release.py
    dest: "{{ photobooth_release_script }}"
    mode: "0700"

- name: Clean stale staging uploads (older than 6 hours)
  ansible.builtin.command:
    argv: [python3, "{{ photobooth_release_script }}", --root, "{{ photobooth_release_root }}", clean-staging, --older-than-hours, "6"]
  changed_when: (photobooth_release_cleaned.stdout | from_json).removed | int > 0
  register: photobooth_release_cleaned

- name: Free space on the release filesystem (KiB)
  ansible.builtin.command:
    argv: [df, -Pk, "{{ photobooth_release_root }}"]
  register: photobooth_release_df
  changed_when: false

- name: Enough space for the upload plus the configured reserve
  vars:
    free_kib: "{{ (photobooth_release_df.stdout_lines[-1].split())[3] | int }}"
    upload_kib: "{{ ((photobooth_release_meta.assets[0].size | int) / 1024) | round(0, 'ceil') | int + 1024 }}"
    reserve_kib: "{{ (photobooth_release_minimum_free_space_mb | int) * 1024 }}"
  ansible.builtin.assert:
    that: free_kib | int >= (upload_kib | int + reserve_kib | int)
    fail_msg: "Not enough space: {{ free_kib }} KiB free, need {{ upload_kib }} KiB plus a {{ reserve_kib }} KiB reserve"
    quiet: true

- name: Unique private staging directory
  ansible.builtin.command:
    argv: [mktemp, -d, -p, "{{ photobooth_release_staging_dir }}", "v{{ release_version }}.XXXXXXXX"]
  register: photobooth_release_upload
  changed_when: true

- name: Upload, publish and verify within the server-side transaction
  block:
    - name: Upload the release into staging
      ansible.builtin.copy:
        src: "{{ release_src }}/"
        dest: "{{ photobooth_release_upload.stdout }}/"
        mode: preserve

    - name: Publish, verify public bytes and apply retention under the server-side lock
      ansible.builtin.command:
        argv: >-
          {{
            ['python3', photobooth_release_script, '--root', photobooth_release_root,
             'publish', '--staging-dir', photobooth_release_upload.stdout,
             '--expected-sha256', release_sha256,
             '--reserve-mb', photobooth_release_minimum_free_space_mb | string,
             '--retention-enabled' if photobooth_release_retention_enabled | bool else '--no-retention-enabled',
             '--archive-keep', photobooth_release_archive_keep | string,
             '--max-versions', photobooth_release_max_versions | string]
             + (['--verify-origin', photobooth_release_public_origin]
                if photobooth_release_verify_public | default(true) | bool else [])
             + ['--public-prefix', photobooth_release_public_prefix]
          }}
      register: photobooth_release_publish
      changed_when: (photobooth_release_publish.stdout | from_json).status == 'published'
      failed_when: photobooth_release_publish.rc != 0

    - name: Publication result
      ansible.builtin.set_fact:
        photobooth_release_result: "{{ photobooth_release_publish.stdout | from_json }}"

  always:
    - name: Remove the staging upload
      ansible.builtin.file:
        path: "{{ photobooth_release_upload.stdout }}"
        state: absent
