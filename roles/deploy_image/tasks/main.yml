---
# Deploy a registry-image project: render compose (+ optional config/env files),
# pull images, and bring the stack up. Restart with --force-recreate only when
# rendered config checksums change (or always when image pull is intentional).

- name: Resolve project config
  ansible.builtin.set_fact:
    proj: "{{ projects[project] }}"

- name: Fail if project is unknown
  ansible.builtin.fail:
    msg: "Unknown project '{{ project }}'. Known: {{ projects.keys() | list }}"
  when: project not in projects

- name: Require an image tag
  ansible.builtin.fail:
    msg: "image_tag is not set (pass -e image_tag=<tag>)."
  when: image_tag is not defined or image_tag | length == 0

- name: Resolve trading-bot secrets dict
  ansible.builtin.set_fact:
    apexvoid_trading_bot_secrets: "{{ lookup('vars', proj.secrets_var) }}"
  when: proj.secrets_var is defined

- name: Resolve trading-bot structured config
  ansible.builtin.set_fact:
    apexvoid_trading_bot_config: "{{ lookup('vars', proj.config_var) }}"
  when: proj.config_var is defined

- name: Resolve trading-bot bootstrap ENV
  ansible.builtin.set_fact:
    apexvoid_trading_bot_bootstrap_env: "{{ lookup('vars', proj.bootstrap_env_var) }}"
  when: proj.bootstrap_env_var is defined

- name: Require trading-bot secret keys
  ansible.builtin.assert:
    that:
      - apexvoid_trading_bot_secrets[item] is defined
      - (apexvoid_trading_bot_secrets[item] | string | length) > 0
    fail_msg: >-
      Project '{{ project }}' requires secret key '{{ item }}'
      in {{ proj.secrets_var }}.
    quiet: true
  loop: "{{ proj.required_secret_keys | default([]) }}"
  when: proj.required_secret_keys is defined

- name: Require trading-bot bootstrap keys
  ansible.builtin.assert:
    that:
      - apexvoid_trading_bot_bootstrap_env[item] is defined
      - (apexvoid_trading_bot_bootstrap_env[item] | string | length) > 0
    fail_msg: >-
      Project '{{ project }}' requires bootstrap key '{{ item }}'
      in {{ proj.bootstrap_env_var }}.
    quiet: true
  loop:
    - CTRADER_CONFIGURATION_SOURCE
    - CTRADER_MANIFEST_PARITY_MODE
    - APEXVOID_CONFIG_FILE
    - APEXVOID_RUNTIME_MANIFEST_FILE
    - REDIS_URL
    - HEALTH_FILE
    - CTRADER_HOST
    - CTRADER_PORT
  when: proj.bootstrap_env_var is defined

- name: Assert trading-bot Vault and bootstrap ENV are disjoint
  ansible.builtin.assert:
    that:
      - (apexvoid_trading_bot_secrets.keys() | list | intersect(apexvoid_trading_bot_bootstrap_env.keys() | list) | length) == 0
    fail_msg: >-
      Vault secrets and bootstrap ENV must not share keys
      (public bootstrap cannot override Vault).
  when: proj.bootstrap_env_var is defined and proj.secrets_var is defined

- name: Assert trading-bot manifest authority settings
  ansible.builtin.assert:
    that:
      - (apexvoid_trading_bot_bootstrap_env.CTRADER_CONFIGURATION_SOURCE | string) == 'manifest'
      # Bare YAML `off` is boolean false; inventory must use quoted 'off'.
      - (apexvoid_trading_bot_bootstrap_env.CTRADER_MANIFEST_PARITY_MODE | string) == 'off'
      - apexvoid_trading_bot_config.runtime.profile == 'demo_eval'
      - apexvoid_trading_bot_config.contract.instrument.canonical_symbol == 'XAU'
      - apexvoid_trading_bot_config.contract.instrument.symbols == 'XAU'
    fail_msg: >-
      Production must use source=manifest, parity=off, profile=demo_eval,
      and XAU-only instrument policy.
  when: proj.bootstrap_env_var is defined and proj.config_var is defined

- name: Assert no manifest-owned trading ENV remains in bootstrap
  ansible.builtin.assert:
    that:
      - item not in apexvoid_trading_bot_bootstrap_env
    fail_msg: >-
      Manifest-owned key '{{ item }}' must not remain in bootstrap ENV.
    quiet: true
  loop:
    - AUTO_TRADE_RISK_PCT
    - AUTO_TRADE_SL_DISTANCE
    - AUTO_TRADE_PROFILE
    - AUTO_TRADE_ENABLED
    - AUTO_TRADE_DRY_RUN
    - CTRADER_SYMBOL
    - CTRADER_TIMEFRAMES
    - CTRADER_EXPECTED_BROKER
    - SCANNER_ENABLED
    - SCANNER_SYMBOLS
  when: proj.bootstrap_env_var is defined

# Legacy image projects that still use a monolithic env dict + required_env_keys
- name: Resolve legacy project environment dict
  ansible.builtin.set_fact:
    proj_env: "{{ lookup('vars', proj.env_var, default={}) }}"
  when: proj.required_env_keys is defined

- name: Require legacy project environment keys
  ansible.builtin.assert:
    that:
      - proj_env[item] is defined
      - (proj_env[item] | string | length) > 0
    fail_msg: "Project '{{ project }}' requires env key '{{ item }}' in {{ proj.env_var }}."
    quiet: true
  loop: "{{ proj.required_env_keys | default([]) }}"
  when: proj.required_env_keys is defined

- name: Ensure target directory exists
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ proj.repo_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Ensure trading-bot config and secrets directories exist
  ansible.builtin.file:
    path: "{{ deploy_root }}/{{ proj.repo_dir }}/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "{{ '0700' if item == 'secrets' else '0755' }}"
  loop:
    - config
    - secrets
  when: proj.config_file_dest is defined

- name: Render trading-bot CONFIG_FILE YAML
  ansible.builtin.copy:
    content: "{{ apexvoid_trading_bot_config | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ deploy_root }}/{{ proj.repo_dir }}/{{ proj.config_file_dest }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  register: trading_bot_yml
  when: proj.config_file_dest is defined

- name: Render trading-bot secret env_file
  ansible.builtin.template:
    src: trading-bot.env.j2
    dest: "{{ deploy_root }}/{{ proj.repo_dir }}/{{ proj.env_file_dest }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  register: trading_bot_envfile
  when: proj.env_file_dest is defined

- name: Render docker-compose.yml from the project's Jinja template
  ansible.builtin.template:
    src: "{{ src_base }}/{{ proj.source }}/{{ proj.compose_template | default('docker-compose.yml.j2') }}"
    dest: "{{ deploy_root }}/{{ proj.repo_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  register: trading_bot_compose

- name: Detect trading-bot config checksum change
  ansible.builtin.set_fact:
    trading_bot_config_changed: "{{
      (trading_bot_yml is defined and trading_bot_yml is changed)
      or (trading_bot_envfile is defined and trading_bot_envfile is changed)
      or (trading_bot_compose is changed)
    }}"
  when: proj.config_file_dest is defined

- name: Pull the new images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ deploy_root }}/{{ proj.repo_dir }}"
  changed_when: true

- name: Bring the stack up
  ansible.builtin.command:
    cmd: >-
      docker compose up -d --remove-orphans
      {% if proj.config_file_dest is not defined
            or (trading_bot_config_changed | default(true) | bool)
         %}--force-recreate{% endif %}
    chdir: "{{ deploy_root }}/{{ proj.repo_dir }}"
  changed_when: true

- name: Confirm services are running
  ansible.builtin.command:
    cmd: docker compose ps --status running --format '{% raw %}{{.Service}}{% endraw %}'
    chdir: "{{ deploy_root }}/{{ proj.repo_dir }}"
  register: compose_ps
  changed_when: false
  retries: 5
  delay: 3
  until: compose_ps.stdout_lines | length >= (proj.expected_services | default(1))
